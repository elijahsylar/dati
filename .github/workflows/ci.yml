name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node: [18, 20, 24] # 18: the oldest version package.json and the README support
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Syntax check (server, migrations, tests)
        run: for f in $(git ls-files 'server/*.js' 'server/**/*.js' 'db/**/*.js' 'test/*.js'); do node --check "$f"; done
      - run: npm test
